services:
  - type: web
    name: ronda-server
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '10000'
      - key: CORS_ORIGIN
        value: https://ronda-web-psi.vercel.app
      - key: DATABASE_URL
        # Secreto de Neon PostgreSQL configurado en Render. Nunca se guarda la
        # cadena de conexión en el repositorio.
        sync: false
