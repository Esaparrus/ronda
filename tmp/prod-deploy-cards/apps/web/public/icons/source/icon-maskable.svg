<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Icono "maskable": el fondo llega hasta el borde y la marca queda
       dentro de la zona segura central (80% aprox) para que el SO pueda
       recortarlo en cualquier forma sin cortar la palabra "Ronda". -->
  <rect width="512" height="512" fill="#14161F"/>
  <text x="256" y="266" text-anchor="middle" font-family="'Familjen Grotesk','Poppins',sans-serif" font-weight="700" font-size="64" fill="#EDE6D8">Ronda</text>
  <rect x="206" y="288" width="100" height="5" rx="2.5" fill="#D4462F"/>
</svg>
